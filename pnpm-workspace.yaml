packages:
  - "packages/*"
  - "open-sse"
# Match `.npmrc`'s legacy-peer-deps posture. OmniRoute imports only the deep
# icon modules from @lobehub/icons; auto-installing its unused @lobehub/ui peer
# pulls a large UI subtree (including packages without distributable licenses).
autoInstallPeers: false
allowBuilds:
  "@parcel/watcher": true
  "@playwright/browser-chromium": true
  "@swc/core": true
  better-sqlite3: true
  bun: true
  core-js: true
  esbuild: true
  keytar: true
  libxmljs2: true
  onnxruntime-node: true
  opencode-ai: true
  protobufjs: true
  sharp: true
  unrs-resolver: true
